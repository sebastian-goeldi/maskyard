name: Documentation

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: docs-${{ github.event_name == 'pull_request' && github.ref || 'versions' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: ${{ github.event_name == 'push' }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build versioned docs
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/docs-versions; then
            git branch docs-versions origin/docs-versions
          fi
          version=dev
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          uv run --locked --group docs python docs/scripts/build.py --version "$version"
      - run: uv run --locked --group docs --extra web python docs/scripts/check_examples.py
      - uses: actions/upload-artifact@v7
        with:
          name: maskyard-docs
          path: docs/_build/versioned-site/
          if-no-files-found: error
      - name: Save version history
        if: github.event_name == 'push'
        run: git push origin docs-versions
