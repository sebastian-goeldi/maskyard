name: Documentation

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv run --locked --group docs --extra web python docs/scripts/build.py
      - run: uv run --locked --group docs --extra web python docs/scripts/check_examples.py
      - uses: actions/upload-artifact@v7
        with:
          name: maskyard-docs
          path: docs/site/

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    concurrency:
      group: docs-deploy
      queue: max
    permissions:
      contents: write
      pages: write
    env:
      DOCS_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Publish with Mike
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$DOCS_VERSION" == dev ]]; then
            main_tip=$(git ls-remote --refs origin refs/heads/main | cut -f1)
            [[ "$main_tip" == "$GITHUB_SHA" ]] || exit 0
          fi
          uv run --locked --group docs python docs/scripts/build.py --version "${DOCS_VERSION#v}" --push
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
