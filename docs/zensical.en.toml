[project]
site_name = "MaskYard"
strict = true
docs_dir = "source-built/en"
site_dir = "site/en"
nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quickstart" = "getting-started/quickstart.md" },
  ] },
  { "Concepts" = [
    { "Cells, layers, and geometry" = "concepts/layout.md" },
    { "Hierarchy and ports" = "concepts/hierarchy.md" },
    { "PDKs and PCells" = "concepts/pcells.md" },
  ] },
  { "How-to Guides" = [
    { "Configure the database" = "how-to/database.md" },
    { "Open the layout viewer" = "how-to/viewer.md" },
    { "Batch cell writes" = "how-to/batched-writes.md" },
    { "Run PCells with Ray" = "how-to/ray.md" },
  ] },
  { "Examples" = [{ "30-MZI chip" = "examples/mzi.md" }] },
  { "API Reference" = "reference/index.md" },
]

[project.theme]
custom_dir = "overrides"
font = false
language = "en"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle = { icon = "material/brightness-auto", name = "Switch to light mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle = { icon = "material/brightness-7", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle = { icon = "material/brightness-4", name = "Follow system preference" }

[project.markdown_extensions]
attr_list = {}

[project.markdown_extensions.pymdownx.snippets]
base_path = ["docs/examples", "examples"]
check_paths = true
dedent_subsections = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["../src"]

[project.plugins.mkdocstrings.handlers.python.options]
allow_inspection = false
show_source = false
show_root_heading = true

[project.extra]
alternate = true

[project.extra.version]
provider = "mike"
